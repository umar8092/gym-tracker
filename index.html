<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="A personal gym log: pick today's muscle, log sets and kilograms, and watch your progress.">
<meta name="theme-color" content="#0B7A75">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B7A75'/%3E%3Cpath d='M6 16h20M9 11v10M23 11v10M5 13.5v5M27 13.5v5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="preload" href="fonts/barlowcondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply the saved theme before first paint
  try { var t = localStorage.getItem('gymtracker.theme'); if (t) { document.documentElement.setAttribute('data-theme', t); } } catch (e) {}
</script>
</head>
<body>
<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Today</a>
    <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a>
    <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</a>
    <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Plan</a>
  </div>
</nav>
<main id="view" tabindex="-1"></main>
<div class="rest" id="rest" hidden role="timer"><span id="rest-t"></span><button type="button" data-rest="add">+15 s</button><button type="button" data-rest="skip">Skip</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/muscle.js"></script>
<script src="js/machines.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
</body>
</html>
