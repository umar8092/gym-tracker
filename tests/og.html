<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Anton";src:url(../fonts/Anton-400.woff2)}
@font-face{font-family:"Archivo";src:url(../fonts/Archivo-800.woff2);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#0A0A0B;color:#F4F4F2;font-family:"Archivo",sans-serif;font-weight:800;position:relative;overflow:hidden}
.tick{position:absolute;left:0;right:0;top:0;height:64px;background:#E5202E;display:flex;align-items:center;gap:36px;padding:0 56px;font-size:20px;letter-spacing:.2em;text-transform:uppercase}
.tick b{font-family:"Anton";font-weight:400;font-size:30px;letter-spacing:.06em}
.name{position:absolute;left:56px;top:104px;font-family:"Anton";font-weight:400;font-size:104px;line-height:.94;text-transform:uppercase;letter-spacing:.01em}
.vs{position:absolute;left:58px;top:432px;font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:#B4B4BA}.vs b{color:#F4F4F2}.vs em{font-style:normal;color:#FF5A66;padding:0 14px}
.sub{position:absolute;left:58px;bottom:54px;font-size:25px;letter-spacing:.12em;text-transform:uppercase;color:#9C9CA5;display:flex;gap:26px}
.sub span+span:before{content:"";display:inline-block;width:8px;height:8px;background:#D9A93A;margin-right:26px;vertical-align:middle}
.fig{position:absolute;right:-30px;bottom:-40px;height:640px}
.badge{position:absolute;left:58px;top:448px;background:#D9A93A;color:#0A0A0B;font-size:20px;letter-spacing:.2em;padding:8px 16px;border-radius:3px;text-transform:uppercase}
</style></head><body>
<div class="tick"><b>Friday night</b><span>Main event</span><span>5 bouts</span><span>Rest 60–90 s between rounds</span></div>
<div class="name">Gym<br>Workout<br>Tracker</div>
<div class="vs"><b>You</b><em>vs</em>last time's you</div>
<img class="fig" src="../img/ex/barbell-bench-press.webp">
<div class="sub"><span>Free</span><span>Works offline</span><span>27 3D form guides</span></div>
</body></html>
