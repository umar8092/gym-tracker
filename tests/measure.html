<!doctype html><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Rig } from '../js/fig/rig.js';
const gltf = await new GLTFLoader().loadAsync('../models/Superhero_Male_FullBody.gltf');
const rig = new Rig(gltf.scene); const out = {};
for (const n of ['pelvis','spine_01','spine_02','spine_03','neck_01','Head','clavicle_l','upperarm_l','lowerarm_l','hand_l','thigh_l','calf_l','foot_l','ball_l']) out[n] = rig.rest[n].p.toArray().map(v => +v.toFixed(3));
// body surface extents: for horizontal slices at several heights, z-range and x-range of the body skin near centre line
const mesh = []; gltf.scene.traverse(o => { if (o.isSkinnedMesh && o.name.includes('SuperHero')) mesh.push(o); });
const pos = mesh[0].geometry.attributes.position, v = new THREE.Vector3(), slices = {};
mesh[0].updateMatrixWorld(true);
const ys = [0.05,0.3,0.5,0.7,0.85,0.95,1.05,1.15,1.25,1.35,1.42,1.5,1.55];
for (const y of ys) { let zmin=9,zmax=-9,xmin=9,xmax=-9; for (let i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i).applyMatrix4(mesh[0].matrixWorld); if (Math.abs(v.y-y)<0.012 && Math.abs(v.x)<0.4) { zmin=Math.min(zmin,v.z); zmax=Math.max(zmax,v.z); xmin=Math.min(xmin,v.x); xmax=Math.max(xmax,v.x);} } slices[y]=[zmin,zmax,xmin,xmax].map(a=>+a.toFixed(3)); }
console.log(JSON.stringify({ bones: out, slices }));
const bb = new THREE.Box3().setFromObject(mesh[0]); console.log('bbox', JSON.stringify(bb.min.toArray().map(a=>+a.toFixed(2))), JSON.stringify(bb.max.toArray().map(a=>+a.toFixed(2))), 'verts', pos.count, 'meshname', mesh[0].name);
window.__done = true;
</script>
